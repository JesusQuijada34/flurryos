# FlurryOS OS Android runtime configuration
# The first backend is an AOSP/Cuttlefish x86_64 device, not Waydroid.
FLURRYOS_ANDROID_BACKEND=aosp-cuttlefish
FLURRYOS_ANDROID_HOME=/var/lib/flurryos/android
FLURRYOS_APK_DIR=/var/lib/flurryos/apks
FLURRYOS_ADB_BIN=/usr/bin/adb
FLURRYOS_ANDROID_SERIAL=localhost:6520
FLURRYOS_LAUNCHER_PACKAGE=com.flurryos.launcher
